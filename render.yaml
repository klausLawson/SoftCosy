services:
  # ── Backend Django ────────────────────────────────────────────────────────
  # Le frontend (site vitrine + app de gestion, fusionnés) est déployé
  # séparément sur Vercel — Render n'héberge que ce backend Django.
  - type: web
    name: softcosy-backend
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn gestion_softcosy.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: softcosy-backend.onrender.com,softcosy.store,www.softcosy.store
